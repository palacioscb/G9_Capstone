; esp32_pan_tilt — lazo interno de la plataforma pan-tilt (IEE2913, Grupo 9)
; Abrir ESTA carpeta con la extensión PlatformIO de VS Code (PIO Home > Open Project).

[env:esp32dev]
platform = espressif32@^6          ; núcleo Arduino-ESP32 2.0.x (el mismo de la prueba de concepto)
board = esp32dev                   ; ESP32 clásico WROOM (DevKit de 30 o 38 pines)
framework = arduino
monitor_speed = 921600             ; el enlace con la RPi y la consola usan la misma velocidad
monitor_eol = LF
monitor_echo = yes
upload_speed = 921600
build_flags = -Wall -Wextra
