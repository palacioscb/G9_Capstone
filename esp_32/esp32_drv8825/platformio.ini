; Prueba de concepto ESP32 + DRV8825 — IEE2913 Grupo 9
; Abrir esta carpeta con la extensión PlatformIO de VSCode (PIO Home > Open Project).
; La primera compilación descarga el toolchain y el core Arduino-ESP32 (~1 GB, requiere internet).

[env:esp32dev]
platform = espressif32
board = esp32dev            ; ESP32 clásico (WROOM DevKit 30/38 pines). Para S3: esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_eol = LF            ; los comandos terminan en \n
monitor_echo = yes
upload_speed = 921600
build_flags = -Wall
